<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Canvas</title>
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Design Your Thangka</h1>
            <p class="subtitle">Choose a canvas shape and color palette to begin</p>
        </header>

        <!-- Shape Selection -->
        <section class="selection-section">
            <h2>Step 1: Choose Canvas Shape</h2>
            <div class="shape-grid">
                <div class="shape-card" data-shape="square">
                    <div class="shape-icon">
                        <svg width="100" height="100" viewBox="0 0 100 100">
                            <rect x="10" y="10" width="80" height="80" fill="none" stroke="currentColor" stroke-width="3"/>
                        </svg>
                    </div>
                    <h3>Square</h3>
                    <p>Classic balanced design</p>
                </div>

                <div class="shape-card" data-shape="circle">
                    <div class="shape-icon">
                        <svg width="100" height="100" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="3"/>
                        </svg>
                    </div>
                    <h3>Circle</h3>
                    <p>Harmonious mandala style</p>
                </div>

                <div class="shape-card" data-shape="rectangle-h">
                    <div class="shape-icon">
                        <svg width="100" height="80" viewBox="0 0 100 80">
                            <rect x="5" y="20" width="90" height="40" fill="none" stroke="currentColor" stroke-width="3"/>
                        </svg>
                    </div>
                    <h3>Horizontal</h3>
                    <p>Wide landscape format</p>
                </div>

                <div class="shape-card" data-shape="rectangle-v">
                    <div class="shape-icon">
                        <svg width="80" height="100" viewBox="0 0 80 100">
                            <rect x="20" y="5" width="40" height="90" fill="none" stroke="currentColor" stroke-width="3"/>
                        </svg>
                    </div>
                    <h3>Vertical</h3>
                    <p>Traditional portrait style</p>
                </div>
            </div>
        </section>

        <!-- Color Selection (hidden initially) -->
        <section id="colorSection" class="selection-section hidden">
            <h2>Step 2: Choose Color Theme</h2>
            <div class="color-grid" id="colorGrid">
                <!-- Colors will be dynamically loaded based on shape selection -->
            </div>
        </section>

        <!-- Start Button (hidden initially) -->
        <div id="startButtonContainer" class="start-container hidden">
            <button id="startButton" class="btn-start">
                Start Designing
                <span class="arrow">→</span>
            </button>
        </div>

        <!-- Back Button -->
        <button class="btn-back" onclick="goBack()">← Back to QR Code</button>
    </div>

    <script src="../scripts/index.js"></script>
</body>
</html>
